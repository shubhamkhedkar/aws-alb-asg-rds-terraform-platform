# Local stand-in for the Application Load Balancer: one listener, round-robin
# across the web replicas, upstream health handled by Docker health checks.
upstream web_tier {
    server web:8080 max_fails=2 fail_timeout=10s;
}

server {
    listen 8080;
    server_tokens off;

    # Echo which replica answered, the way ALB access logs record the target.
    add_header X-Upstream $upstream_addr always;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://web_tier;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
