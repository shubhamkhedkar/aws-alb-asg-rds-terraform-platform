# Local mirror of the two tiers:
#   proxy (ALB stand-in) -> web x2 (ASG stand-in) -> db (RDS MySQL stand-in)
# The db service is on an internal network, like the isolated database subnets.
name: tallybook

services:
  proxy:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:${PROXY_PORT:-8088}:8080"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [public, app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: .
    image: tallybook:local
    deploy:
      replicas: 2
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-tallybook}
      DB_USER: ${DB_USER:-tally_app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (copy .env.example)}
      DB_CONNECT_RETRIES: "30"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    networks: [app, data]

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tallybook}
      MYSQL_USER: ${DB_USER:-tally_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

networks:
  public: {}
  app:
    internal: true
  data:
    internal: true

volumes:
  db-data: {}
